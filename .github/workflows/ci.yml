name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          # standalone install — bypasses the runner's default Node
          # (too old for this package's engines.node)
          standalone: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - run: pnpm build

      # Dogfood this checkout (npm 0.1.7 is not published until this lands).
      # Check is the gate. Push is best-effort so a missing/invalid token
      # still leaves the coverage verdict in the log.
      - name: tested check + hobby push
        if: github.event_name == 'pull_request'
        uses: ./action
        with:
          version: '0.1.7'
          cli-path: .
          push: 'true'
          pr-number: ${{ github.event.pull_request.number }}
          token: ${{ secrets.TESTED_TOKEN }}
