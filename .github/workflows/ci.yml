name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          # standalone install — bypasses the runner's default Node
          # (too old for this package's engines.node)
          standalone: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - run: pnpm build

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: coverage-final
          if-no-files-found: error
          path: |
            coverage/coverage-final.json
            test-results/junit.xml

  # Separate from typecheck/test/build so an unpublished npm version or
  # Action install glitch cannot fail unit CI. Check is the gate; push
  # is continue-on-error inside the Action.
  tested:
    name: tested check + hobby push
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage-final
          path: .

      - name: Place JUnit at junit.xml
        run: |
          set -euo pipefail
          test -f coverage/coverage-final.json
          test -f test-results/junit.xml
          cp test-results/junit.xml junit.xml
          echo "placed test-results/junit.xml -> junit.xml"

      - uses: ./action
        with:
          version: '0.1.10'
          cli-path: .
          push: 'true'
          junit: junit.xml
          pr-number: ${{ github.event.pull_request.number }}
          token: ${{ secrets.TESTED_TOKEN }}

  # Pointer job for Clive → Margot: runtime setup/check + codecov teardown
  # (not pack-contract greps). Same files also run in the test job above.
  runtime-e2e:
    name: runtime e2e (from-nothing setup/check + from-codecov teardown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          standalone: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: from-nothing setup/check + from-codecov teardown
        run: >
          pnpm exec vitest run
          tests/integration/from-nothing-setup-check-e2e.test.ts
          tests/integration/from-codecov-teardown-check-e2e.test.ts
