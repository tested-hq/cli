name: 'tested'
description: 'Run tested.dev coverage gate (check) and optionally push a share URL or mainline coverage'
author: 'tested-hq'

branding:
  icon: 'check-circle'
  color: 'gray-dark'

inputs:
  version:
    description: >
      npm version of @tested/cli to install (e.g. 0.1.3).
      Ignored when cli-path or cli-ref is set.
    required: false
    default: '0.1.3'
  cli-path:
    description: >
      Local path to a checkout of tested-hq/cli (already on the runner).
      When set, the action builds from this path instead of npm.
    required: false
    default: ''
  cli-repository:
    description: >
      GitHub repository for the git fallback (owner/name).
      Used only when cli-ref is set.
    required: false
    default: 'tested-hq/cli'
  cli-ref:
    description: >
      Optional git ref (branch, tag, or commit SHA) to install instead of npm.
      Leave empty (default) to install @tested/cli from npm.
    required: false
    default: ''
  working-directory:
    description: 'Project directory that contains coverage + .tested.yaml.'
    required: false
    default: '.'
  base:
    description: >
      Git base for tested check. Empty (default) uses the PR base SHA on
      pull_request, or the previous commit on push. Fetched if missing —
      consumers do not need fetch-depth: 0.
    required: false
    default: ''
  push:
    description: 'If true, also run tested push after a successful check.'
    required: false
    default: 'false'
  pr-number:
    description: 'PR number for tested push (or set GITHUB_PR_NUMBER). Not required with mainline=true.'
    required: false
    default: ''
  mainline:
    description: >
      If true, push default-branch project coverage only (isDefaultBranch).
      Use on push to main/master. Does not create a share URL.
    required: false
    default: 'false'
  token:
    description: 'Ingest token (TESTED_TOKEN). Prefer secrets.TESTED_TOKEN.'
    required: false
    default: ''
  api-url:
    description: 'Optional TESTED_API_URL override.'
    required: false
    default: ''
  junit:
    description: >-
      Path to JUnit XML for test analytics (flakes / slowest). Also auto-detects
      junit.xml under the working directory. Sets TESTED_JUNIT for tested push.
    required: false
    default: ''
  node-version:
    description: 'Node.js version for the CLI (setup-node).'
    required: false
    default: '24'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install CLI
      id: cli
      shell: bash
      env:
        CLI_PATH: ${{ inputs.cli-path }}
        CLI_REF: ${{ inputs.cli-ref }}
        CLI_REPOSITORY: ${{ inputs.cli-repository }}
        CLI_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${{ github.action_path }}/install-cli.sh"

    - name: tested check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TESTED_SAFE_RUN: '1'
        INPUT_BASE: ${{ inputs.base }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
        PUSH_BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        if [ -z "${PR_BASE_REF:-}" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
          PR_BASE_REF="$GITHUB_BASE_REF"
        fi
        BASE="$(bash "${{ github.action_path }}/resolve-check-base.sh")"
        echo "tested check --base $BASE"
        tested check --base "$BASE"

    - name: tested push (optional)
      if: inputs.push == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_JUNIT: ${{ inputs.junit }}
      run: |
        set -euo pipefail
        if [ -n "${INPUT_TOKEN:-}" ]; then
          export TESTED_TOKEN="$INPUT_TOKEN"
        fi
        if [ -n "${INPUT_API_URL:-}" ]; then
          export TESTED_API_URL="$INPUT_API_URL"
        fi
        if [ -n "${INPUT_PR_NUMBER:-}" ]; then
          export GITHUB_PR_NUMBER="$INPUT_PR_NUMBER"
        fi
        if [ -n "${INPUT_JUNIT:-}" ]; then
          export TESTED_JUNIT="$INPUT_JUNIT"
        fi
        if [ -z "${TESTED_TOKEN:-}" ]; then
          echo "push=true requires token input or TESTED_TOKEN" >&2
          exit 1
        fi
        EXTRA_URL=()
        if [ -n "${TESTED_API_URL:-}" ]; then
          EXTRA_URL=(--url "$TESTED_API_URL")
        fi
        EXTRA_JUNIT=()
        if [ -n "${TESTED_JUNIT:-}" ]; then
          EXTRA_JUNIT=(--junit "$TESTED_JUNIT")
        fi
        MAINLINE="${{ inputs.mainline }}"
        # Auto-mainline on push to default branch when not a PR event
        if [ "$MAINLINE" != "true" ] && [ "${{ github.event_name }}" = "push" ]; then
          DEF="${{ github.event.repository.default_branch }}"
          REF="${{ github.ref_name }}"
          if [ -n "$DEF" ] && [ "$REF" = "$DEF" ]; then
            MAINLINE=true
          fi
        fi
        if [ "$MAINLINE" = "true" ]; then
          tested push --mainline "${EXTRA_URL[@]}" "${EXTRA_JUNIT[@]}"
          exit 0
        fi
        PR="${GITHUB_PR_NUMBER:-}"
        if [ -z "$PR" ]; then
          PR="${{ github.event.pull_request.number }}"
        fi
        if [ -z "$PR" ] || [ "$PR" = "" ]; then
          echo "push=true requires pr-number, a pull_request event, or mainline=true / push to default branch" >&2
          exit 1
        fi
        tested push --pr "$PR" "${EXTRA_URL[@]}" "${EXTRA_JUNIT[@]}"
