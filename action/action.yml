name: 'tested'
description: 'Run tested.dev coverage gate (check) and optionally push a share URL'
author: 'tested-hq'

branding:
  icon: 'check-circle'
  color: 'gray-dark'

inputs:
  cli-path:
    description: >
      Local path to a checkout of tested-hq/cli (already on the runner).
      When set, the action builds from this path instead of cloning from git.
    required: false
    default: ''
  cli-repository:
    description: 'GitHub repository to install the CLI from (owner/name).'
    required: false
    default: 'tested-hq/cli'
  cli-ref:
    description: >
      Git ref (branch, tag, or full commit SHA) of tested-hq/cli to install.
      Pin to a commit SHA in production for reproducible CI.
    required: false
    default: 'main'
  working-directory:
    description: 'Project directory that contains coverage + .tested.yaml.'
    required: false
    default: '.'
  base:
    description: 'Git base ref for tested check (optional).'
    required: false
    default: ''
  push:
    description: 'If true, also run tested push after a successful check.'
    required: false
    default: 'false'
  pr-number:
    description: 'PR number for tested push (or set GITHUB_PR_NUMBER).'
    required: false
    default: ''
  token:
    description: 'Ingest token (TESTED_TOKEN). Prefer secrets.TESTED_TOKEN.'
    required: false
    default: ''
  api-url:
    description: 'Optional TESTED_API_URL override.'
    required: false
    default: ''
  node-version:
    description: 'Node.js version for the CLI (setup-node).'
    required: false
    default: '24'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable corepack (pnpm)
      shell: bash
      run: corepack enable

    - name: Resolve CLI source
      id: cli
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.cli-path }}" ]; then
          SRC="${{ inputs.cli-path }}"
          if [ ! -d "$SRC" ]; then
            echo "cli-path does not exist: $SRC" >&2
            exit 1
          fi
          echo "source=path" >> "$GITHUB_OUTPUT"
          echo "dir=$SRC" >> "$GITHUB_OUTPUT"
        else
          DEST="${{ github.action_path }}/.cli-src"
          REF="${{ inputs.cli-ref }}"
          REPO="${{ inputs.cli-repository }}"
          rm -rf "$DEST"
          # Prefer branch/tag shallow clone; fall back for full commit SHAs.
          if git clone --depth 1 --branch "$REF" "https://github.com/${REPO}.git" "$DEST" 2>/dev/null; then
            :
          else
            git clone --filter=blob:none --no-checkout "https://github.com/${REPO}.git" "$DEST"
            git -C "$DEST" fetch --depth 1 origin "$REF"
            git -C "$DEST" checkout FETCH_HEAD
          fi
          echo "source=git" >> "$GITHUB_OUTPUT"
          echo "dir=$DEST" >> "$GITHUB_OUTPUT"
          echo "Installed tested CLI from git ${REPO}@${REF}"
        fi

    - name: Install and build CLI
      shell: bash
      working-directory: ${{ steps.cli.outputs.dir }}
      run: |
        set -euo pipefail
        if command -v pnpm >/dev/null 2>&1; then
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
        else
          corepack prepare pnpm@11.3.0 --activate
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
        fi
        test -f dist/tested.js
        echo "TESTED_BIN=$(pwd)/dist/tested.js" >> "$GITHUB_ENV"
        echo "$(pwd)/dist" >> "$GITHUB_PATH"

    - name: tested check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TESTED_SAFE_RUN: '1'
      run: |
        set -euo pipefail
        BIN="${TESTED_BIN:-tested}"
        if [ -n "${{ inputs.base }}" ]; then
          node "$BIN" check --base "${{ inputs.base }}"
        else
          node "$BIN" check
        fi

    - name: tested push (optional)
      if: inputs.push == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TESTED_TOKEN: ${{ inputs.token }}
        TESTED_API_URL: ${{ inputs.api-url }}
        GITHUB_PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail
        BIN="${TESTED_BIN:-tested}"
        if [ -z "${TESTED_TOKEN:-}" ]; then
          echo "push=true requires token input or TESTED_TOKEN" >&2
          exit 1
        fi
        PR="${GITHUB_PR_NUMBER:-}"
        if [ -z "$PR" ]; then
          PR="${{ github.event.pull_request.number }}"
        fi
        if [ -z "$PR" ] || [ "$PR" = "" ]; then
          echo "push=true requires pr-number or a pull_request event" >&2
          exit 1
        fi
        EXTRA_URL=()
        if [ -n "${TESTED_API_URL:-}" ]; then
          EXTRA_URL=(--url "$TESTED_API_URL")
        fi
        node "$BIN" push --pr "$PR" "${EXTRA_URL[@]}"
