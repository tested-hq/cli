name: 'tested'
description: 'Run tested.dev coverage gate (check) and optionally push a share URL or mainline coverage'
author: 'tested-hq'

branding:
  icon: 'check-circle'
  color: 'gray-dark'

inputs:
  version:
    description: >
      npm version of @tested/cli to install (e.g. 0.1.8).
      Ignored when cli-path or cli-ref is set.
    required: false
    default: '0.1.8'
  cli-path:
    description: >
      Local path to a checkout of tested-hq/cli (already on the runner).
      When set, the action builds from this path instead of npm.
    required: false
    default: ''
  cli-repository:
    description: >
      GitHub repository for the git fallback (owner/name).
      Used only when cli-ref is set.
    required: false
    default: 'tested-hq/cli'
  cli-ref:
    description: >
      Optional git ref (branch, tag, or commit SHA) to install instead of npm.
      Leave empty (default) to install @tested/cli from npm.
    required: false
    default: ''
  working-directory:
    description: 'Project directory that contains coverage + .tested.yaml.'
    required: false
    default: '.'
  base:
    description: >
      Git base for tested check and tested push. Empty (default) uses the PR
      base SHA on pull_request, or the previous commit on push. Fetched if
      missing — consumers do not need fetch-depth: 0.
    required: false
    default: ''
  push:
    description: 'If true, also run tested push after a successful check.'
    required: false
    default: 'false'
  pr-number:
    description: 'PR number for tested push (or set GITHUB_PR_NUMBER). Not required with mainline=true.'
    required: false
    default: ''
  mainline:
    description: >
      If true, push default-branch project coverage only (isDefaultBranch).
      Use on push to main/master. Does not create a share URL.
    required: false
    default: 'false'
  token:
    description: 'Ingest token (TESTED_TOKEN). Prefer secrets.TESTED_TOKEN.'
    required: false
    default: ''
  api-url:
    description: 'Optional TESTED_API_URL override (trusted). Ambient TESTED_API_URL is ignored.'
    required: false
    default: ''
  junit:
    description: >-
      Path to JUnit XML for test analytics (flakes / slowest). When empty,
      searches junit.xml, test-results/junit.xml, coverage/junit.xml, and
      reports/junit.xml under the working directory. Sets TESTED_JUNIT.
    required: false
    default: ''
  files:
    description: >-
      Coverage files to merge locally before check/push (newline or
      comma-separated). Overrides coverage.path. Use for one job with
      many artifacts (e.g. coverage/lcov.info + coverage/python.xml).
    required: false
    default: ''
  parts:
    description: >-
      Total shard count for a matrix (Codecov after_n_builds / Qlty
      total-parts-count). Push is incomplete until complete=true or
      part equals parts. Missing shards fail or stay pending — no
      carryforward.
    required: false
    default: ''
  part:
    description: '1-based shard index. When equal to parts, this upload concludes the gate.'
    required: false
    default: ''
  complete:
    description: >-
      true concludes the gate (finish job / last part). false uploads a
      shard only — GitHub checks must not complete. Empty infers from
      parts/part.
    required: false
    default: ''
  run-id:
    description: >-
      Groups shards for one CI run + SHA. Defaults to github.run_id when
      parts is set.
    required: false
    default: ''
  shard:
    description: 'Optional shard label (e.g. matrix job name).'
    required: false
    default: ''
  node-version:
    description: 'Node.js version for the CLI (setup-node).'
    required: false
    default: '24'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install CLI
      id: cli
      shell: bash
      env:
        CLI_PATH: ${{ inputs.cli-path }}
        CLI_REF: ${{ inputs.cli-ref }}
        CLI_REPOSITORY: ${{ inputs.cli-repository }}
        CLI_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${{ github.action_path }}/install-cli.sh"

    - name: tested check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TESTED_SAFE_RUN: '1'
        INPUT_BASE: ${{ inputs.base }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_PARTS: ${{ inputs.parts }}
        INPUT_PART: ${{ inputs.part }}
        INPUT_COMPLETE: ${{ inputs.complete }}
        INPUT_RUN_ID: ${{ inputs.run-id }}
        INPUT_SHARD: ${{ inputs.shard }}
        ACTION_PATH: ${{ github.action_path }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
        PUSH_BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bash "${{ github.action_path }}/run-check.sh"

    - name: tested push (optional)
      if: inputs.push == 'true'
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_JUNIT: ${{ inputs.junit }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_PARTS: ${{ inputs.parts }}
        INPUT_PART: ${{ inputs.part }}
        INPUT_COMPLETE: ${{ inputs.complete }}
        INPUT_RUN_ID: ${{ inputs.run-id }}
        INPUT_SHARD: ${{ inputs.shard }}
        INPUT_MAINLINE: ${{ inputs.mainline }}
        INPUT_REPOSITORY: ${{ github.repository }}
        INPUT_BASE: ${{ inputs.base }}
        ACTION_PATH: ${{ github.action_path }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
        PUSH_BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REF_NAME: ${{ github.ref_name }}
      run: bash "${{ github.action_path }}/run-push.sh"
